# AmoDesk: branded Linux x86_64 build (deb + rpm).
#
# Based on build-rustdesk-linux (x86_64) in flutter-build.yml. Built inside an
# Ubuntu 18.04 container, so the binaries need only glibc 2.27 and run on
# Debian/Ubuntu, Astra Linux (deb), RED OS / Fedora / RHEL (rpm), openSUSE (suse rpm).
# Server settings: repository variables AMODESK_*, see amodesk-windows.yml.
#
# Run: Actions -> "AmoDesk Linux" -> Run workflow, or push a tag amodesk-v*.

name: AmoDesk Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "amodesk-v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  AMODESK_RENDEZVOUS_SERVER: ${{ vars.AMODESK_RENDEZVOUS_SERVER }}
  AMODESK_RS_PUB_KEY: ${{ vars.AMODESK_RS_PUB_KEY }}
  AMODESK_API_SERVER: ${{ vars.AMODESK_API_SERVER }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-linux:
    name: linux-x86_64
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
      VCPKG_TRIPLET: x64-linux
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm qemu-user-static librsvg2-bin

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Apply AmoDesk branding
        run: |
          python3 amodesk/rebrand.py
          python3 amodesk/rebrand_platform.py linux
          bash amodesk/gen_icons.sh desktop

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: echo "RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: sed -i "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev
          if ! $VCPKG_ROOT/vcpkg install --triplet $VCPKG_TRIPLET --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build AmoDesk
        with:
          arch: x86_64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y build-essential clang cmake curl gcc git g++ \
              libayatana-appindicator3-dev libasound2-dev libclang-10-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
              libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libxdo-dev libxfixes-dev llvm-10-dev nasm ninja-build pkg-config tree \
              python3 rpm unzip wget xz-utils libssl-dev
            apt-get remove -y libopus-dev || true
          run: |
            set -e
            git config --global --add safe.directory "*"
            # Rust without rustup (as upstream)
            pushd /opt
            wget -q -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            tar -zxf rust.tar.gz && rm rust.tar.gz
            (cd rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu && ./install.sh > /dev/null)
            popd
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build ~/.cargo
            popd

            # Flutter
            pushd /opt
            wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            export PATH=/opt/flutter/bin:$PATH
            flutter doctor -v
            (cd /opt/flutter && git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff)
            popd

            # deb
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --skip-cargo
            mkdir -p dist
            mv amodesk-${{ env.VERSION }}.deb dist/amodesk-${{ env.VERSION }}-x86_64.deb

            # rpm (Fedora / RED OS / RHEL) and rpm for openSUSE
            HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
            mv ~/rpmbuild/RPMS/x86_64/amodesk-*.rpm dist/amodesk-${{ env.VERSION }}-x86_64.rpm
            HBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb
            mv ~/rpmbuild/RPMS/x86_64/amodesk-*.rpm dist/amodesk-${{ env.VERSION }}-x86_64-suse.rpm
            ls -l dist

      - name: Check packages
        run: |
          set -e
          sudo chown -R "$(id -u)" dist
          dpkg-deb -I dist/amodesk-${{ env.VERSION }}-x86_64.deb
          dpkg-deb -c dist/amodesk-${{ env.VERSION }}-x86_64.deb | grep -E 'usr/share/amodesk/amodesk$|amodesk.service|applications/amodesk.desktop'
          rpm -qip dist/amodesk-${{ env.VERSION }}-x86_64.rpm
          # The binary must carry our server, not the upstream public one.
          mkdir -p /tmp/deb && dpkg-deb -x dist/amodesk-${{ env.VERSION }}-x86_64.deb /tmp/deb
          if [ -n "$AMODESK_RENDEZVOUS_SERVER" ]; then
            grep -c "$AMODESK_RENDEZVOUS_SERVER" /tmp/deb/usr/share/amodesk/lib/librustdesk.so
            if grep -q "rs-ny.rustdesk.com" /tmp/deb/usr/share/amodesk/lib/librustdesk.so; then echo "::error::upstream server in the binary"; exit 1; fi
          fi
          sha256sum dist/*

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amodesk-linux-x86_64
          path: dist
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/amodesk-v')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          files: dist/*
